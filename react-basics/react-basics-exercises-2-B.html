<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
     

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ProductDetails({ name, priceUSD, discountPriceUSD, imageSrc }) {
        return (
          <>
            <div>
              <img src={imageSrc} width="50" />
            </div>

            <p>{name}</p>

            { !discountPriceUSD  ? (
                <p>Price: ${priceUSD}</p>
              ) 
              : (
              <del>
                <p>Price: ${priceUSD}</p>
              </del>
            ) }

            {discountPriceUSD && (
                <p>Discount Price: ${discountPriceUSD}</p>
            )}

            <button>Add to Cart</button>
          </>
        );
      }

     function App() {
        return (
          <>
            <ProductDetails 
              name="Cotton Socks" 
              priceUSD="10.90" 
              discountPriceUSD="5.45"
              imageSrc="cotton-socks.png"
            />

            <ProductDetails 
              name="Tennis Balls" 
              priceUSD="6.00" 
              imageSrc="tennis-balls.png"
            />

            <ProductDetails 
              name="T-shirt" 
              priceUSD="12.00" 
              imageSrc="plain-t-shirt.png"
            />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
