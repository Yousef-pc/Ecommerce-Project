<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>

    <style>
      body {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
        background-color: rgb(222, 222, 222);
      }

      .send-button {
        background-color: rgb(25, 135, 84);
        font-size: 1rem;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 1rem;
        margin-left: 10px;
      }

      .chat-input {
        flex: 1;
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 1rem;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }

      .app-container {
        background-color: rgb(222, 222, 222);
        max-width: 600px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }

      .chat-message-robot {
        display: flex;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        margin: 0 10px 20px 10px;
        border-radius: 10px;
        max-width: 300px;
      }

      .chat-message-profile {
        width: 45px;
      }

      .chat-messages-container {
        flex: 1;
        margin-top: 20px;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .loading-img {
        width: 40px;
        margin: -15px;
      }

    </style>
  </head>
  <body>
    <div class="js-container"></div>
     

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({chatMessages, setChatMessages, isLoading, setIsLoading}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (inputText === "") {
            return;
          }

          if (isLoading === true) {
            return;
          }
          
          setIsLoading(true);

          console.log("helllo");

          const newChatMessages = [
            ...chatMessages, 
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ]

          setChatMessages(newChatMessages);
          setInputText('');
          // Showing LOading... state before the real message is sent by the Robot:
          setChatMessages([
            ...newChatMessages, 
            {
              message: <img src="loading-spinner.gif" className="loading-img"/>,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          // Main message by the Robot:
          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            ...newChatMessages, 
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          setIsLoading(false);
        }

        async function sendMessageByEnter(event) {
          if (event.key !== "Enter") return;

          if (inputText === "") {
            return;
          }

          if (isLoading === true) {
            return;
          }

          setIsLoading(true);

          const newChatMessages = [
            ...chatMessages, 
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ]

          setChatMessages(newChatMessages);
          setInputText('');
          // Showing LOading... state before the real message is sent by the Robot:
          setChatMessages([
            ...newChatMessages, 
            {
              message: <img src="loading-spinner.gif" className="loading-img" />,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          // Main message by the Robot:
          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            ...newChatMessages, 
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          setIsLoading(false);
        }

        function resetInputByEsc(event) {
          if (event.key === "Escape") {
            setInputText('');
          }
        }

        return (
          <div className="chat-input-container">
            <input 
              placeholder="Send a message to the Chatbot" 
              size="30"
              onChange={saveInputText}
              onKeyDown={(event) => {
                sendMessageByEnter(event);
                resetInputByEsc(event);
              }}
              value={inputText}
              className="chat-input"
            />
            <button
              onClick={sendMessage}
              className="send-button"
            >
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {

        return (
          <div className={
            sender === 'user' 
              ? 'chat-message-user' 
              : 'chat-message-robot'
          }>
            {sender === "robot" && (
              <img src="robot.png" className="chat-message-profile" />
            )}
            <div className="chat-message-text">
              {message}
            </div>
            {sender === "user" && (
              <img src="user.png" className="chat-message-profile" />
            )}
          </div>
        );
      }

      function useAutoScroll(dependencies) {
        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [dependencies]);

        return chatMessagesRef;
      }

      function ChatMessages({ chatMessages }) {
        const ref = useAutoScroll(chatMessages);

        return (
          <div className="chat-messages-container" ref={ref}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
           })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        const [isLoading, setIsLoading] = React.useState(false);

        return (
          <div className="app-container">
            <ChatMessages
              chatMessages={chatMessages}
            />
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={isLoading}
              setIsLoading={setIsLoading}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
